# Entorno de desarrollo. Ejecutar desde la raíz del repo:
#   docker compose -f deploy/docker/compose.dev.yml --env-file .env up -d sqlserver
# La clave de SA se toma de SQLSERVER_SA_PASSWORD en .env (ignorado por git; ver .env.example).
# Imagen, variables y sqlcmd según https://learn.microsoft.com/sql/linux/quickstart-install-connect-docker
name: wabulk-dev

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wabulk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Falta SQLSERVER_SA_PASSWORD en .env}
    ports:
      # Puerto 14333 en el host para no chocar con un SQL Server instalado localmente (1433).
      - "127.0.0.1:14333:1433"
    volumes:
      - wabulk-sqldata:/var/opt/mssql
    healthcheck:
      # Desde SQL Server 2022 CU14 las herramientas están en mssql-tools18; -C confía en el certificado autofirmado.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  wabulk-sqldata:
